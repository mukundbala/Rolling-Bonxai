rolling_bonxai_server_node:
  ros__parameters:
    frame_id: "map"
    base_frame_id: "zed_camera_link"
    topic_in: "/zed/zed_node/point_cloud/cloud_registered"
    qos_reliable: false # true = reliable subscription (bag playback); false = SensorDataQoS (live sensors)

    occupancy:
      resolution: 0.1
      occupancy_min_z: -100.0
      occupancy_max_z: 100.0
      occupancy_threshold: 0.50
    
    sensor_model:
      max_range: 9.0 # keep <= (radius - hysteresis_ratio) * chunk_size, or endpoints outside the loaded chunks are dropped
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97

    rolling:
      coordinate_system:
        chunk_size: 5.0 #double m
        
      transition_manager:
        hysteresis_ratio: 0.2 #[0.01,1.0]

      loading_policy:
        name: "neighbourhood" # "planar","temporal" ##String
        neighborhood:
          radius: 2 #int, used by all policies
        planar:
          z_min: 1 #int
          z_max: 2 #int
          use_relative: true #bool
        temporal:
          age_weightage: 0.3 #[0.01,1.0] double
          max_age_s: 300 #int in seconds

      storage:
        full_save_folder_path: "/ros2_ws/src/Rolling-Bonxai/experiments/rolling_bonxai/chunks/default" # bag launch overrides this per run

      asyncio:
        enable_io: true
        num_load_threads: 3 #int
        num_save_threads: 1 #int

    server:
      cleanup_interval_sec: 120.0

    stats:
      enable_stats: true
      quick_stats: true
      publish_occupied_voxels: false
      publish_rate: 1.0 #Hz

    visualization:
      chunk_alpha: 0.06 # opacity of the chunk boxes on /rolling_bonxai/chunk_markers [0,1]; was hard-coded 0.15